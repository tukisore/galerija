# The whole app: docker compose up -d --build, then open http://localhost:3000
# POSTGRES_* and FRONT_PORT come from the environment or a .env file next to this one, with these defaults.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scalaweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalaweb}
      POSTGRES_DB: ${POSTGRES_DB:-scalaweb}
    ports:
      # only reachable from this machine
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: scala-web-backend:latest
    build: ./backend
    restart: always
    # settings and secrets (JWT_SECRET, MAILERSEND_*) as in development
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scalaweb}
      DB_USER: ${POSTGRES_USER:-scalaweb}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-scalaweb}
      MEDIA_DIR: /data/media
    volumes:
      # the same uploads as when running it with scala-cli
      - ./backend/media:/data/media
    # not published: the front reaches it inside the compose network, and the browser through the front

  front:
    image: scala-web-front:latest
    build:
      context: ./front
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONT_PORT:-3008}:3000"

  # restic, for ./backup.sh and ./restore.sh; not started by docker compose up
  backup:
    image: restic/restic:0.18.1
    profiles: [tools]
    environment:
      RESTIC_REPOSITORY: /repo
      # encrypts the backups, which cannot be read without it
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
    volumes:
      # the backup folder
      - ${BACKUP_DIR:-./backups}:/repo
      - ./backend/media:/data/media
      # the database dump, written by backup.sh
      - ./.backup-tmp:/data/db

volumes:
  postgres-data:
