# The whole app: docker compose up -d --build, then open http://localhost:3000
# POSTGRES_* and FRONT_PORT come from the environment or a .env file next to this one, with these defaults.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scalaweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalaweb}
      POSTGRES_DB: ${POSTGRES_DB:-scalaweb}
    ports:
      # only reachable from this machine
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: scala-web-backend:latest
    build: ./backend
    restart: always
    # settings and secrets (JWT_SECRET, MAILERSEND_*) as in development
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_PATH: /data/db
      MEDIA_DIR: /data/media
    volumes:
      # the same database and uploads as when running it with scala-cli
      - ./backend/db:/data/db
      - ./backend/media:/data/media
    # not published: the front reaches it inside the compose network, and the browser through the front

  front:
    image: scala-web-front:latest
    build:
      context: ./front
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONT_PORT:-3000}:3000"

volumes:
  postgres-data:
